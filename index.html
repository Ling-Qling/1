<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="C# 知识复习卡片应用 - 支持测验模式">
    <title>C# 复习</title>
    
    <style>
        /* ========== CSS 变量定义 ========== */
        :root {
            --bg-primary: #f5f7fa;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #5a6c7d;
            --accent: #3498db;
            --accent-hover: #2980b9;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --border: #e0e6ed;
            --shadow: rgba(0, 0, 0, 0.1);
            --code-bg: #282c34;
            --tag-bg: #3498db20;
            --difficulty-beginner: #27ae60;
            --difficulty-intermediate: #f39c12;
            --difficulty-advanced: #e74c3c;
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #0f3460;
            --text-primary: #eaeaea;
            --text-secondary: #a0a0a0;
            --accent: #4a9eff;
            --accent-hover: #3498db;
            --border: #2c3e50;
            --shadow: rgba(0, 0, 0, 0.3);
            --tag-bg: #4a9eff30;
        }

        /* ========== 全局样式 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        /* ========== 导航栏 ========== */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: var(--bg-secondary);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 10px var(--shadow);
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .logo { font-size: 1.3rem; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .logo-icon { font-size: 1.5rem; }

        .nav-buttons { display: flex; gap: 8px; flex-wrap: wrap; }

        .nav-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .nav-btn:active { transform: scale(0.95); }
        .nav-btn.secondary { background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border); }
        .nav-btn.danger { background: var(--danger); }
        .nav-btn.active { background: var(--accent); box-shadow: 0 0 0 2px white, 0 0 0 4px var(--accent); }

        /* ========== 模式切换按钮 ========== */
        .mode-switch {
            display: flex;
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 4px;
            gap: 4px;
        }

        .mode-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            background: transparent;
            color: var(--text-secondary);
        }

        .mode-btn:hover { background: var(--bg-secondary); }
        .mode-btn.active { background: var(--accent); color: white; }

        /* ========== 主容器 ========== */
        .container { max-width: 1200px; margin: 0 auto; padding: 80px 20px 40px; }

        /* ========== 复习模式样式 ========== */
        .filters {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 2px 10px var(--shadow);
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--bg-primary);
            color: var(--text-primary);
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }

        .search-box:focus { outline: none; border-color: var(--accent); }

        .filter-buttons { display: flex; flex-wrap: wrap; gap: 8px; }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid var(--border);
            border-radius: 20px;
            background: var(--bg-primary);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
        .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .cards-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .cards-grid { grid-template-columns: repeat(2, 1fr); } }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 10px var(--shadow);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s;
        }

        .card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px var(--shadow); }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .card-title { font-size: 1.1rem; font-weight: 600; color: var(--text-primary); flex: 1; }
        .card-difficulty {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            color: white;
            margin-left: 12px;
            white-space: nowrap;
        }

        .difficulty-beginner { background: var(--difficulty-beginner); }
        .difficulty-intermediate { background: var(--difficulty-intermediate); }
        .difficulty-advanced { background: var(--difficulty-advanced); }

        .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .tag { background: var(--tag-bg); color: var(--accent); padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; }

        .card-preview { color: var(--text-secondary); font-size: 0.95rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card.expanded .card-preview { display: none; }

        .card-details { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
        .card.expanded .card-details { display: block; animation: fadeIn 0.3s; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .detail-section { margin-bottom: 16px; }
        .detail-label { font-weight: 600; color: var(--accent); margin-bottom: 8px; font-size: 0.9rem; }
        .detail-content { color: var(--text-secondary); font-size: 0.95rem; }

        .code-block {
            background: var(--code-bg);
            color: #abb2bf;
            padding: 16px;
            border-radius: 8px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.85rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .card-actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
        .card-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; }
        .card-btn:active { transform: scale(0.95); }
        .card-btn.edit { background: var(--accent); color: white; }
        .card-btn.delete { background: var(--danger); color: white; }

        /* ========== 测验模式样式 ========== */
        .quiz-container { max-width: 700px; margin: 0 auto; }

        .quiz-setup {
            background: var(--bg-secondary);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px var(--shadow);
            text-align: center;
        }

        .quiz-setup h2 { font-size: 1.5rem; margin-bottom: 10px; color: var(--accent); }
        .quiz-setup p { color: var(--text-secondary); margin-bottom: 24px; }

        .quiz-options { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
        .quiz-option { display: flex; align-items: center; gap: 12px; }
        .quiz-option label { font-weight: 500; min-width: 100px; }
        .quiz-option input[type="number"] {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .quiz-type-selector { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; }
        .quiz-type-btn {
            padding: 10px 20px;
            border: 2px solid var(--border);
            border-radius: 20px;
            background: var(--bg-primary);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .quiz-type-btn:hover { border-color: var(--accent); color: var(--accent); }
        .quiz-type-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .start-quiz-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }

        .start-quiz-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4); }

        /* ========== 测验进行中 ========== */
        .quiz-progress {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 10px var(--shadow);
        }

        .progress-bar-container { background: var(--bg-primary); border-radius: 10px; height: 10px; overflow: hidden; margin-bottom: 12px; }
        .progress-bar { background: linear-gradient(90deg, var(--accent), var(--success)); height: 100%; border-radius: 10px; transition: width 0.3s; }

        .progress-text { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--text-secondary); }
        .progress-text span { display: flex; align-items: center; gap: 4px; }

        .quiz-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px var(--shadow);
            margin-bottom: 20px;
        }

        .question-type {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .question-type.choice { background: var(--accent); color: white; }
        .question-type.judge { background: var(--warning); color: white; }
        .question-type.fill { background: var(--success); color: white; }

        .question-text {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .options-list { display: flex; flex-direction: column; gap: 12px; }

        .option-item {
            padding: 16px 20px;
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-primary);
        }

        .option-item:hover:not(.disabled) { border-color: var(--accent); background: var(--bg-secondary); }
        .option-item.selected { border-color: var(--accent); background: rgba(52, 152, 219, 0.1); }
        .option-item.correct { border-color: var(--success); background: rgba(39, 174, 96, 0.1); }
        .option-item.incorrect { border-color: var(--danger); background: rgba(231, 76, 60, 0.1); }
        .option-item.disabled { cursor: default; opacity: 0.7; }

        .option-letter {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .option-item.correct .option-letter { background: var(--success); color: white; }
        .option-item.incorrect .option-letter { background: var(--danger); color: white; }

        .option-text { flex: 1; }

        /* ========== 答案解析 ========== */
        .answer-feedback {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            border-left: 4px solid;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .answer-feedback.correct { border-color: var(--success); }
        .answer-feedback.incorrect { border-color: var(--danger); }

        .feedback-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: 600; font-size: 1.1rem; }
        .feedback-header.correct { color: var(--success); }
        .feedback-header.incorrect { color: var(--danger); }

        .analysis-card {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
        }

        .analysis-card h4 { color: var(--accent); margin-bottom: 8px; font-size: 0.95rem; }
        .analysis-card p { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 8px; }
        .analysis-card pre { margin-top: 8px; }

        .next-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 20px;
            background: var(--accent);
            color: white;
        }

        .next-btn:hover { background: var(--accent-hover); }

        /* ========== 测验结果 ========== */
        .quiz-result {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 20px var(--shadow);
            text-align: center;
        }

        .result-icon { font-size: 5rem; margin-bottom: 20px; }
        .result-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 10px; }
        .result-subtitle { color: var(--text-secondary); margin-bottom: 30px; }

        .score-display {
            background: var(--bg-primary);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .score-number { font-size: 4rem; font-weight: 700; color: var(--accent); line-height: 1; }
        .score-label { color: var(--text-secondary); margin-top: 8px; }

        .score-stats { display: flex; justify-content: center; gap: 30px; margin-top: 20px; }
        .score-stat { text-align: center; }
        .score-stat-value { font-size: 1.5rem; font-weight: 600; }
        .score-stat-label { font-size: 0.85rem; color: var(--text-secondary); }
        .score-stat.correct .score-stat-value { color: var(--success); }
        .score-stat.incorrect .score-stat-value { color: var(--danger); }

        .wrong-questions { margin-top: 30px; text-align: left; }
        .wrong-questions h3 { margin-bottom: 16px; color: var(--danger); font-size: 1.2rem; }

        .wrong-question-item {
            background: var(--bg-primary);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .wrong-question-item:hover { transform: translateX(4px); }
        .wrong-question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .wrong-question-title { font-weight: 500; }
        .wrong-question-answer { font-size: 0.9rem; color: var(--text-secondary); }

        .result-actions { display: flex; gap: 12px; margin-top: 30px; }
        .result-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .result-btn.primary { background: var(--accent); color: white; }
        .result-btn.secondary { background: var(--bg-primary); color: var(--text-primary); border: 2px solid var(--border); }
        .result-btn:hover { transform: translateY(-2px); }

        /* ========== 模态弹窗 ========== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.show { display: flex; animation: fadeIn 0.2s; }

        .modal {
            background: var(--bg-secondary);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 1.3rem; font-weight: 600; }
        .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-secondary); padding: 4px; }
        .modal-close:hover { color: var(--danger); }

        /* ========== 表单 ========== */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; margin-bottom: 6px; font-weight: 500; color: var(--text-primary); }
        .form-label .required { color: var(--danger); }

        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: border-color 0.2s;
        }

        .form-input:focus, .form-textarea:focus, .form-select:focus { outline: none; border-color: var(--accent); }
        .form-textarea { min-height: 100px; resize: vertical; }
        .form-input.error, .form-textarea.error { border-color: var(--danger); }
        .form-error { color: var(--danger); font-size: 0.85rem; margin-top: 4px; }
        .form-hint { color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px; }

        .form-actions { display: flex; gap: 12px; margin-top: 24px; }
        .form-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .form-btn:active { transform: scale(0.98); }
        .form-btn.submit { background: var(--success); color: white; }
        .form-btn.cancel { background: var(--bg-primary); color: var(--text-primary); border: 2px solid var(--border); }

        /* ========== 空状态 ========== */
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .empty-icon { font-size: 4rem; margin-bottom: 20px; }
        .empty-text { font-size: 1.1rem; margin-bottom: 20px; }

        .stats { text-align: center; padding: 12px; color: var(--text-secondary); font-size: 0.9rem; }

        /* ========== 隐藏元素 ========== */
        .hidden { display: none !important; }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .navbar { padding: 10px 12px; }
            .nav-btn { padding: 6px 12px; font-size: 0.85rem; }
            .mode-btn { padding: 6px 12px; font-size: 0.85rem; }
            .quiz-card, .quiz-result { padding: 20px; }
            .score-stats { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>
    <!-- ========== 导航栏 ========== -->
    <nav class="navbar">
        <div class="logo">
            <span class="logo-icon">📚</span>
            <span>C# 复习</span>
        </div>
        <div class="nav-buttons">
            <!-- 模式切换 -->
            <div class="mode-switch">
                <button class="mode-btn active" data-mode="review" onclick="switchMode('review')">📖 复习模式</button>
                <button class="mode-btn" data-mode="quiz" onclick="switchMode('quiz')">✏️ 测验模式</button>
            </div>
        </div>
    </nav>

    <!-- ========== 主容器 ========== -->
    <main class="container">
        <!-- ========== 复习模式 ========== -->
        <div id="reviewMode">
            <div class="filters">
                <input type="text" class="search-box" id="searchInput" placeholder="🔍 搜索题目或解释..." oninput="filterCards()">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-difficulty="all" onclick="setDifficultyFilter('all')">全部</button>
                    <button class="filter-btn" data-difficulty="beginner" onclick="setDifficultyFilter('beginner')">🟢 初级</button>
                    <button class="filter-btn" data-difficulty="intermediate" onclick="setDifficultyFilter('intermediate')">🟡 中级</button>
                    <button class="filter-btn" data-difficulty="advanced" onclick="setDifficultyFilter('advanced')">🔴 高级</button>
                </div>
            </div>

            <div class="stats" id="stats"></div>
            <div class="cards-grid" id="cardsGrid"></div>
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-icon">📝</div>
                <p class="empty-text">暂无知识点</p>
                <button class="nav-btn" onclick="openModal()">➕ 添加第一个知识点</button>
            </div>
        </div>

        <!-- ========== 测验模式 ========== -->
        <div id="quizMode" class="hidden">
            <!-- 测验设置 -->
            <div class="quiz-container" id="quizSetup">
                <div class="quiz-setup">
                    <h2>✏️ C# 知识测验</h2>
                    <p id="quizInfo">准备好测试您的 C# 知识了吗？</p>
                    
                    <div class="quiz-options">
                        <div class="quiz-option">
                            <label>题目数量</label>
                            <input type="number" id="questionCount" min="1" max="50" value="10">
                        </div>
                    </div>

                    <div class="quiz-type-selector">
                        <button class="quiz-type-btn active" data-type="all" onclick="selectQuizType('all')">📝 全部题型</button>
                        <button class="quiz-type-btn" data-type="choice" onclick="selectQuizType('choice')">🔘 选择题</button>
                        <button class="quiz-type-btn" data-type="judge" onclick="selectQuizType('judge')">✓ 判断题</button>
                        <button class="quiz-type-btn" data-type="fill" onclick="selectQuizType('fill')">💻 代码填空</button>
                    </div>

                    <button class="start-quiz-btn" onclick="startQuiz()">🚀 开始测验</button>
                </div>
            </div>

            <!-- 测验进行中 -->

    <script>
        /* ========== 默认知识点数据（C#异步编程示例） ========== */
        const DEFAULT_KNOWLEDGE = [
            {

    using var client = new HttpClient();

}`,

                code: `// 将CPU密集型操作移到后台线程
var result = await Task.Run(() => {
    // 复杂计算

});`,

                code: `var task1 = DownloadAsync(url1);
var task2 = DownloadAsync(url2);
var task3 = DownloadAsync(url3);

// 并行执行所有下载
string[] results = await Task.WhenAll(task1, task2, task3);`,
                extension: '使用 WhenAll 比顺序 await 更快，因为它同时启动所有任务。',

                code: ` CancellationTokenSource cts = new CancellationTokenSource();

try {

} catch (OperationCanceledException) {

}

// 在其他线程取消
cts.Cancel();`,
                extension: '将 CancellationToken 作为参数传递给异步方法，在方法内定期检查 IsCancellationRequested。',

            {

                code: `public async Task<string> GetDataAsync() {
    using var client = new HttpClient();
    // 不捕获原始上下文

                code: `// 立即完成的操作返回 ValueTask
public ValueTask<int> GetCachedValueAsync() {
    if (cache.ContainsKey(key)) {

    // 需要异步操作

}`,
                extension: 'ValueTask 只能被 await 一次。不要在同步代码中直接访问 Result。',

            {

                explanation: 'IAsyncEnumerable<T> (async yield) 允许异步生成数据流，类似同步的 yield return。',
                code: `async IAsyncEnumerable<int> GenerateNumbersAsync() {
    for (int i = 0; i < 10; i++) {
        await Task.Delay(100); // 异步等待

    }
}

// 使用
await foreach (var num in GenerateNumbersAsync()) {
    Console.WriteLine(num);
}`,
                extension: '适用于处理大数据集或实时数据流，避免一次性加载所有数据到内存。',
                difficulty: 'advanced',
                tags: ['异步流', 'IAsyncEnumerable', 'yield']
            },
            {
                id: 'default-8',
                title: 'SemaphoreSlim 限制并发数',
                explanation: 'SemaphoreSlim 用于限制同时执行的异步操作数量，防止资源耗尽。',
                code: `var semaphore = new SemaphoreSlim(3); // 最多3个并发

async Task ProcessItemsAsync(IEnumerable<Item> items) {
    var tasks = items.Select(async item => {
        await semaphore.WaitAsync();
        try {
            await ProcessAsync(item);
        } finally {
            semaphore.Release();
        }
    });
    await Task.WhenAll(tasks);
}`,
                extension: '使用 SemaphoreSlim.WaitAsync() 而不是 Semaphore.Wait()，避免阻塞线程。',

        /* ========== 全局状态 ========== */
        let knowledgeList = [];
        let currentDifficulty = 'all';
        let searchTerm = '';
        let editingId = null;
        let currentMode = 'review';
        let selectedQuizType = 'all';

        // 测验状态
        let quizQuestions = [];
        let currentQuestionIndex = 0;
        let correctCount = 0;
        let wrongQuestions = [];

        /* ========== 初始化 ========== */
        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            loadKnowledge();
            renderCards();
            updateQuizInfo();
        });

        /* ========== 模式切换 ========== */
        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });

            document.getElementById('reviewMode').classList.toggle('hidden', mode !== 'review');
            document.getElementById('quizMode').classList.toggle('hidden', mode !== 'quiz');

            if (mode === 'quiz') {
                resetQuiz();
            }
        }

        /* ========== ID 生成器 ========== */
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        /* ========== 数据持久化 ========== */
        function saveKnowledge() {
            localStorage.setItem('csharp-knowledge', JSON.stringify(knowledgeList));
            updateStats();
            updateQuizInfo();
        }

        function loadKnowledge() {
            const stored = localStorage.getItem('csharp-knowledge');
            if (stored) {
                knowledgeList = JSON.parse(stored);
            } else {
                knowledgeList = JSON.parse(JSON.stringify(DEFAULT_KNOWLEDGE));
                saveKnowledge();
            }
        }

        /* ========== 主题切换 ========== */
        function loadTheme() {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        /* ========== 测验相关函数 ========== */
        function updateQuizInfo() {
            const count = knowledgeList.length;
            document.getElementById('quizInfo').textContent = 
                `题库共 ${count} 道题，准备好测试您的 C# 异步编程知识了吗？`;
            document.getElementById('questionCount').max = count;
            if (parseInt(document.getElementById('questionCount').value) > count) {
                document.getElementById('questionCount').value = count;
            }
        }

        function selectQuizType(type) {
            selectedQuizType = type;
            document.querySelectorAll('.quiz-type-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === type);
            });
        }

        // ========== 生成测验题目 ==========
        function generateQuestions() {
            const count = parseInt(document.getElementById('questionCount').value) || 10;
            const types = selectedQuizType === 'all' ? ['choice', 'judge', 'fill'] : [selectedQuizType];
            
            // 打乱顺序
            const shuffled = [...knowledgeList].sort(() => Math.random() - 0.5);
            const selected = shuffled.slice(0, Math.min(count, shuffled.length));

            const questions = [];
            selected.forEach((item, index) => {
                const type = types[index % types.length];
                if (type === 'choice') {
                    questions.push(generateChoiceQuestion(item));
                } else if (type === 'judge') {
                    questions.push(generateJudgeQuestion(item));
                } else if (type === 'fill') {
                    questions.push(generateFillQuestion(item));
                }
            });

            return questions;
        }

        // 生成选择题
        function generateChoiceQuestion(item) {
            const otherItems = knowledgeList.filter(k => k.id !== item.id);
            const shuffledOthers = otherItems.sort(() => Math.random() - 0.5).slice(0, 3);

            // 干扰项来源：其他知识点标题或代码片段
            const distractors = shuffledOthers.map(k => {
                return Math.random() > 0.5 ? k.title : (k.code ? extractCodeKeyword(k.code) : k.title);
            });

            // 正确答案
            const correctAnswer = item.title;

            // 生成选项
            const options = shuffleArray([correctAnswer, ...distractors]);

            return {
                type: 'choice',
                typeLabel: '选择题',
                question: `以下哪个是关于 "${item.title}" 的正确描述？`,
                options: options,
                correctIndex: options.indexOf(correctAnswer),
                knowledge: item
            };
        }

        // 生成判断题
        function generateJudgeQuestion(item) {
            const isCorrect = Math.random() > 0.5;
            let statement, correctAnswer;

            if (isCorrect) {
                // 正确陈述：直接使用知识点内容
                statement = item.explanation.substring(0, 50) + (item.explanation.length > 50 ? '...' : '');
                correctAnswer = true;
            } else {
                // 错误陈述：篡改关键词
                const keywords = extractKeywords(item.explanation);
                if (keywords.length > 0) {
                    const wrongKeyword = getRandomWrongKeyword(keywords[0]);
                    statement = item.explanation.replace(keywords[0], wrongKeyword).substring(0, 60) + '...';
                } else {
                    statement = item.explanation.substring(0, 55) + '... [错误版本]';
                }
                correctAnswer = false;
            }

            return {
                type: 'judge',
                typeLabel: '判断题',
                question: `判断以下陈述是否正确：\n\n${statement}`,
                options: ['正确', '错误'],
                correctIndex: correctAnswer ? 0 : 1,
                knowledge: item
            };
        }

        // 生成代码填空题
        function generateFillQuestion(item) {
            if (!item.code) {
                // 如果没有代码，改为选择题
                return generateChoiceQuestion(item);
            }

            const keywords = extractCodeKeywords(item.code);
            if (keywords.length === 0) {
                return generateChoiceQuestion(item);
            }

            const targetKeyword = keywords[Math.floor(Math.random() * keywords.length)];
            const blankedCode = item.code.replace(new RegExp(`\\b${targetKeyword}\\b`, 'g'), '___');
            const wrongOptions = getWrongCodeOptions(targetKeyword);

            const options = shuffleArray([targetKeyword, ...wrongOptions]);

            return {
                type: 'fill',
                typeLabel: '代码填空',
                question: `在以下代码中，空白处应该填入什么？\n\n${blankedCode}`,
                options: options,
                correctIndex: options.indexOf(targetKeyword),
                knowledge: item
            };
        }

        // 辅助函数：从代码中提取关键词
        function extractCodeKeywords(code) {
            const keywords = ['async', 'await', 'Task', 'var', 'return', 'public', 'private', 
                            'static', 'new', 'using', 'try', 'catch', 'finally', 'throw',
                            'foreach', 'Select', 'Where', 'OrderBy', 'GroupBy', 'Join',
                            'ConfigureAwait', 'WhenAll', 'WhenAny', 'Delay', 'FromResult',
                            'SemaphoreSlim', 'CancellationToken', 'ValueTask', 'yield',
                            'IAsyncEnumerable', 'IEnumerable', 'async IAsyncEnumerable'];
            return keywords.filter(k => code.includes(k));
        }

        function extractCodeKeyword(code) {
            const lines = code.split('\n').filter(l => l.trim() && !l.trim().startsWith('//'));
            if (lines.length === 0) return code.split(' ')[0];
            return lines[0].trim().substring(0, 30);
        }

        function extractKeywords(text) {
            return text.split(/\s+/).filter(w => w.length > 3 && /[\u4e00-\u9fa5a-zA-Z]/.test(w));
        }

        function getRandomWrongKeyword(correct) {
            const wrongOptions = {
                'async': ['await', 'sync', 'Task'],
                'await': ['async', 'wait', 'Task'],
                'Task': ['Thread', 'Process', 'Action'],
                'var': ['let', 'const', 'dynamic'],
                '委托': ['事件', '接口', '类'],
                '泛型': ['继承', '多态', '封装'],
                'LINQ': ['SQL', 'Lambda', '迭代器'],
                'lock': ['synchronized', 'mutex', 'semaphore']
            };
            const options = wrongOptions[correct] || ['错误选项A', '错误选项B', '错误选项C'];
            return options[Math.floor(Math.random() * options.length)];
        }

        function getWrongCodeOptions(correct) {
            const allOptions = {
                'async': ['sync', 'await', 'Task', 'void'],
                'await': ['async', 'wait', '.Result', '.GetAwaiter()'],
                'Task': ['Thread', 'Action', 'Func', 'void'],
                'var': ['let', 'const', 'int', 'string'],
                'return': ['throw', 'yield', 'break', 'continue'],
                'using': ['import', 'include', 'require', 'with'],
                'ConfigureAwait': ['ConfigureWait', 'ConfigureAsync', 'AwaitConfig', 'NoContext'],
                'WhenAll': ['WhenAny', 'WaitAll', 'AllTasks', 'TaskAll'],
                'yield': ['return', 'break', 'yield return', 'async yield'],
                'IAsyncEnumerable': ['IEnumerable', 'IAsyncEnumerator', 'AsyncEnumerable', 'IAwaitable']
            };
            const options = allOptions[correct] || ['错误选项A', '错误选项B', '错误选项C'];
            return options.slice(0, 3);
        }

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        /* ========== 测验控制 ========== */
        function startQuiz() {
            if (knowledgeList.length < 4) {
                alert('题库至少需要4道题目才能开始测验');
                return;
            }

            quizQuestions = generateQuestions();
            currentQuestionIndex = 0;
            correctCount = 0;
            wrongQuestions = [];

            document.getElementById('quizSetup').classList.add('hidden');
            document.getElementById('quizInProgress').classList.remove('hidden');
            document.getElementById('quizResult').classList.add('hidden');

            document.getElementById('totalQ').textContent = quizQuestions.length;
            showQuestion();
        }

        function showQuestion() {
            const q = quizQuestions[currentQuestionIndex];
            const progress = ((currentQuestionIndex) / quizQuestions.length) * 100;

            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('currentQ').textContent = currentQuestionIndex + 1;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongQuestions.length;

            // 题型标签
            const typeEl = document.getElementById('questionType');
            typeEl.textContent = q.typeLabel;
            typeEl.className = 'question-type ' + q.type;

            // 题目文本
            document.getElementById('questionText').textContent = q.question;

            // 选项
            const optionsList = document.getElementById('optionsList');
            const letters = ['A', 'B', 'C', 'D'];
            optionsList.innerHTML = q.options.map((opt, i) => `
                <div class="option-item" data-index="${i}" onclick="selectOption(${i})">
                    <span class="option-letter">${letters[i]}</span>
                    <span class="option-text">${escapeHtml(opt)}</span>
                </div>
            `).join('');

            // 隐藏反馈区域
            document.getElementById('answerFeedback').classList.add('hidden');
        }

        function selectOption(index) {
            const q = quizQuestions[currentQuestionIndex];
            const options = document.querySelectorAll('.option-item');

            // 禁用所有选项
            options.forEach(opt => opt.classList.add('disabled'));

            // 显示正确/错误
            const selected = options[index];
            const isCorrect = index === q.correctIndex;

            if (isCorrect) {
                selected.classList.add('correct');
                correctCount++;
            } else {
                selected.classList.add('incorrect');
                options[q.correctIndex].classList.add('correct');
                wrongQuestions.push(q);
            }

            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongQuestions.length;

            // 显示反馈
            showFeedback(isCorrect, q);
        }

        function showFeedback(isCorrect, q) {
            const feedback = document.getElementById('answerFeedback');
            const header = document.getElementById('feedbackHeader');
            const content = document.getElementById('feedbackContent');

            feedback.classList.remove('hidden', 'correct', 'incorrect');
            feedback.classList.add(isCorrect ? 'correct' : 'incorrect');

            header.className = 'feedback-header ' + (isCorrect ? 'correct' : 'incorrect');
            header.innerHTML = isCorrect 
                ? '✅ 回答正确！' 
                : `❌ 回答错误（正确答案是：${escapeHtml(q.options[q.correctIndex])})`;

            content.innerHTML = `
                <div class="analysis-card">
                    <h4>📖 ${escapeHtml(q.knowledge.title)}</h4>
                    <p><strong>解释：</strong>${escapeHtml(q.knowledge.explanation)}</p>
                    ${q.knowledge.code ? `<pre class="code-block">${escapeHtml(q.knowledge.code)}</pre>` : ''}
                    ${q.knowledge.extension ? `<p style="margin-top:12px;"><strong>拓展：</strong>${escapeHtml(q.knowledge.extension)}</p>` : ''}
                </div>
            `;

            // 更新下一题按钮
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.textContent = currentQuestionIndex < quizQuestions.length - 1 ? '下一题 →' : '查看结果';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizQuestions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quizInProgress').classList.add('hidden');
            document.getElementById('quizResult').classList.remove('hidden');

            const percentage = Math.round((correctCount / quizQuestions.length) * 100);
            document.getElementById('scoreNumber').textContent = percentage + '%';
            document.getElementById('finalCorrect').textContent = correctCount;
            document.getElementById('finalWrong').textContent = quizQuestions.length - correctCount;

            // 设置表情和标题
            const icon = document.getElementById('resultIcon');
            const title = document.getElementById('resultTitle');
            
            if (percentage >= 90) {
                icon.textContent = '🏆';
                title.textContent = '太棒了！';
            } else if (percentage >= 70) {
                icon.textContent = '🎉';
                title.textContent = '表现不错！';
            } else if (percentage >= 50) {
                icon.textContent = '💪';
                title.textContent = '继续加油！';
            } else {
                icon.textContent = '📚';
                title.textContent = '需要多多复习';
            }

            document.getElementById('resultSubtitle').textContent = 
                `共 ${quizQuestions.length} 题，答对 ${correctCount} 题`;

            // 显示错题列表
            const wrongContainer = document.getElementById('wrongQuestions');
            if (wrongQuestions.length > 0) {
                wrongContainer.innerHTML = `
                    <h3>📝 错题回顾 (${wrongQuestions.length} 题)</h3>
                    ${wrongQuestions.map((q, i) => `
                        <div class="wrong-question-item" onclick="this.classList.toggle('expanded')">
                            <div class="wrong-question-header">
                                <span class="wrong-question-title">${i + 1}. ${escapeHtml(q.knowledge.title)}</span>
                            </div>
                            <div class="wrong-question-answer">
                                正确答案是：${escapeHtml(q.options[q.correctIndex])}
                            </div>
                        </div>
                    `).join('')}
                `;
            } else {
                wrongContainer.innerHTML = '<p style="color: var(--success); font-weight: 600;">🎊 太棒了！全部答对！</p>';
            }
        }

        function restartQuiz() {
            resetQuiz();
            startQuiz();
        }

        function resetQuiz() {
            document.getElementById('quizSetup').classList.remove('hidden');
            document.getElementById('quizInProgress').classList.add('hidden');
            document.getElementById('quizResult').classList.add('hidden');
            quizQuestions = [];
            currentQuestionIndex = 0;
            correctCount = 0;
            wrongQuestions = [];
        }

        /* ========== 复习模式函数 ========== */
        function setDifficultyFilter(difficulty) {
            currentDifficulty = difficulty;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.difficulty === difficulty);
            });
            renderCards();
        }

        function filterCards() {
            searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            renderCards();
        }

        function matchesFilter(item) {
            if (currentDifficulty !== 'all' && item.difficulty !== currentDifficulty) return false;
            if (searchTerm) {
                return item.title.toLowerCase().includes(searchTerm) || 
                       item.explanation.toLowerCase().includes(searchTerm);
            }
            return true;
        }

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            const emptyState = document.getElementById('emptyState');
            const filtered = knowledgeList.filter(matchesFilter);
            
            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            grid.innerHTML = filtered.map(item => createCardHTML(item)).join('');
        }

        function createCardHTML(item) {
            const difficultyLabels = { beginner: '初级', intermediate: '中级', advanced: '高级' };
            const tagsHTML = item.tags.map(tag => `<span class="tag">${tag}</span>`).join('');
            
            return `
                <article class="card" data-id="${item.id}" onclick="toggleCard('${item.id}')">
                    <div class="card-header">
                        <h3 class="card-title">${escapeHtml(item.title)}</h3>
                        <span class="card-difficulty difficulty-${item.difficulty}">${difficultyLabels[item.difficulty]}</span>
                    </div>
                    <div class="card-tags">${tagsHTML}</div>
                    <p class="card-preview">${escapeHtml(item.explanation)}</p>
                    
                    <div class="card-details">
                        <div class="detail-section">
                            <div class="detail-label">📖 解释</div>
                            <div class="detail-content">${escapeHtml(item.explanation)}</div>
                        </div>
                        ${item.code ? `
                        <div class="detail-section">
                            <div class="detail-label">💻 代码示例</div>
                            <pre class="code-block">${escapeHtml(item.code)}</pre>
                        </div>` : ''}
                        ${item.extension ? `
                        <div class="detail-section">
                            <div class="detail-label">🚀 拓展</div>
                            <div class="detail-content">${escapeHtml(item.extension)}</div>
                        </div>` : ''}
                        <div class="card-actions" onclick="event.stopPropagation()">
                            <button class="card-btn edit" onclick="editItem('${item.id}')">✏️ 编辑</button>
                            <button class="card-btn delete" onclick="deleteItem('${item.id}')">🗑️ 删除</button>
                        </div>
                    </div>
                </article>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function toggleCard(id) {
            const card = document.querySelector(`.card[data-id="${id}"]`);
            card.classList.toggle('expanded');
        }

        /* ========== 模态弹窗 ========== */
        function openModal(id = null) {
            editingId = id;
            const title = document.getElementById('modalTitle');
            
            if (id) {
                const item = knowledgeList.find(k => k.id === id);
                if (item) {
                    title.textContent = '编辑知识点';
                    document.getElementById('titleInput').value = item.title;
                    document.getElementById('explanationInput').value = item.explanation;
                    document.getElementById('codeInput').value = item.code || '';
                    document.getElementById('extensionInput').value = item.extension || '';
                    document.getElementById('difficultyInput').value = item.difficulty;
                    document.getElementById('tagsInput').value = item.tags.join(', ');
                }
            } else {
                title.textContent = '添加知识点';
                document.getElementById('knowledgeForm').reset();
            }
            
            document.getElementById('modalOverlay').classList.add('show');
            document.getElementById('titleInput').focus();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
            editingId = null;
            clearErrors();
        }

        function handleOverlayClick(event) {
            if (event.target === event.currentTarget) closeModal();
        }

        function clearErrors() {
            document.getElementById('titleError').textContent = '';
            document.getElementById('explanationError').textContent = '';
            document.querySelectorAll('.form-input, .form-textarea').forEach(el => el.classList.remove('error'));
        }

        /* ========== 表单提交 ========== */
        function handleSubmit(event) {
            event.preventDefault();
            clearErrors();
            
            const title = document.getElementById('titleInput').value.trim();
            const explanation = document.getElementById('explanationInput').value.trim();
            const code = document.getElementById('codeInput').value.trim();
            const extension = document.getElementById('extensionInput').value.trim();
            const difficulty = document.getElementById('difficultyInput').value;
            const tagsInput = document.getElementById('tagsInput').value.trim();
            
            let hasError = false;
            if (!title) {
                document.getElementById('titleError').textContent = '题目不能为空';
                document.getElementById('titleInput').classList.add('error');
                hasError = true;
            }
            if (!explanation) {
                document.getElementById('explanationError').textContent = '解释不能为空';
                document.getElementById('explanationInput').classList.add('error');
                hasError = true;
            }
            if (hasError) return;
            
            const tags = tagsInput ? tagsInput.split(/[,，]/).map(t => t.trim()).filter(t => t) : [];
            
            const item = { id: editingId || generateId(), title, explanation, code, extension, difficulty, tags };
            
            if (editingId) {
                const index = knowledgeList.findIndex(k => k.id === editingId);
                if (index !== -1) knowledgeList[index] = item;
            } else {
                knowledgeList.unshift(item);
            }
            
            saveKnowledge();
            renderCards();
            closeModal();
        }

        /* ========== 编辑和删除 ========== */
        function editItem(id) { openModal(id); }

        function deleteItem(id) {
            const item = knowledgeList.find(k => k.id === id);
            if (!item) return;
            if (confirm(`确定要删除知识点"${item.title}"吗？`)) {
                knowledgeList = knowledgeList.filter(k => k.id !== id);
                saveKnowledge();
                renderCards();
            }
        }

        /* ========== 重置数据 ========== */
        function resetData() {
            if (confirm('确定要重置为默认数据吗？当前所有数据将被覆盖。')) {
                knowledgeList = JSON.parse(JSON.stringify(DEFAULT_KNOWLEDGE));
                saveKnowledge();
                renderCards();
                currentDifficulty = 'all';
                searchTerm = '';
                document.getElementById('searchInput').value = '';
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.difficulty === 'all');
                });
            }
        }

        /* ========== 统计信息 ========== */
        function updateStats() {
            const stats = document.getElementById('stats');
            const total = knowledgeList.length;
            const beginner = knowledgeList.filter(k => k.difficulty === 'beginner').length;
            const intermediate = knowledgeList.filter(k => k.difficulty === 'intermediate').length;
            const advanced = knowledgeList.filter(k => k.difficulty === 'advanced').length;
            stats.textContent = `总计 ${total} 个知识点 | 初级 ${beginner} | 中级 ${intermediate} | 高级 ${advanced}`;
        }

        updateStats();

        /* ========== 导入功能 ========== */
        let pendingImportData = null;

        function handleImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!Array.isArray(data)) {
                        alert('❌ 导入失败：文件格式不正确');
                        return;
                    }

                    const validItems = data.filter(item => item.title && item.explanation);
                    if (validItems.length === 0) {
                        alert('❌ 导入失败：文件中没有有效的知识点');
                        return;
                    }

                    validItems.forEach(item => { item.id = generateId(); });
                    pendingImportData = validItems;
                    showImportModal(validItems.length);
                } catch (error) {
                    alert('❌ 导入失败：' + error.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function showImportModal(count) {
            document.getElementById('importMessage').innerHTML = `发现 <strong>${count}</strong> 个有效知识点`;
            const preview = document.getElementById('importPreview');
            preview.innerHTML = pendingImportData.slice(0, 5).map(item => 
                `<div style="padding: 8px 0; border-bottom: 1px solid var(--border);">
                    <strong>${escapeHtml(item.title)}</strong>
                </div>`
            ).join('');
            document.getElementById('importModalOverlay').classList.add('show');
        }

        function closeImportModal() {
            document.getElementById('importModalOverlay').classList.remove('show');
            pendingImportData = null;
        }

        function importWithMerge() {
            if (!pendingImportData) return;
            knowledgeList = [...pendingImportData, ...knowledgeList];
            saveKnowledge();
            renderCards();
            closeImportModal();
            alert(`✅ 成功导入 ${pendingImportData.length} 个知识点`);
        }

        function importWithReplace() {
            if (!pendingImportData) return;
            if (confirm('⚠️ 确定要替换全部数据吗？')) {
                knowledgeList = pendingImportData;
                saveKnowledge();
                renderCards();
                closeImportModal();
                alert(`✅ 成功导入 ${pendingImportData.length} 个知识点`);
            }
        }

        /* ========== 导出功能 ========== */
        function exportData() {
            if (knowledgeList.length === 0) {
                alert('❌ 没有可导出的数据');
                return;
            }

            const exportData = knowledgeList.map(item => ({
                title: item.title,
                explanation: item.explanation,
                code: item.code || '',
                extension: item.extension || '',
                difficulty: item.difficulty,
                tags: item.tags
            }));

            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `csharp-knowledge-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            alert(`✅ 已导出 ${knowledgeList.length} 个知识点`);
        }

        /* ========== 键盘快捷键 ========== */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                closeImportModal();
            }
            if (e.ctrlKey && e.key === 'n') {
                e.preventDefault();
                if (currentMode === 'review') openModal();
            }
        });
    </script>
</body>
</html>
