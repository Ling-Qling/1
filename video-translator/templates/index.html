<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频翻译 - 生成中文字幕</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>视频翻译</h1>
            <p class="subtitle">上传视频，自动生成中文字幕 (.srt)</p>
        </header>

        <main>
            <!-- 上传区域 -->
            <section id="upload-section" class="card">
                <div class="upload-zone" id="upload-zone">
                    <div class="upload-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                        </svg>
                    </div>
                    <p class="upload-text">点击选择视频文件，或拖拽到此处</p>
                    <p class="upload-hint">支持 .mp4 .avi .mov .mkv，最大 500MB</p>
                    <input type="file" id="file-input" accept=".mp4,.avi,.mov,.mkv" hidden>
                </div>

                <div id="file-info" class="file-info hidden">
                    <span class="file-name" id="file-name"></span>
                    <span class="file-size" id="file-size"></span>
                    <button class="btn btn-sm btn-outline" id="btn-reselect">重新选择</button>
                </div>

                <button class="btn btn-primary btn-full" id="btn-start" disabled>
                    开始处理
                </button>
            </section>

            <!-- 状态区域 -->
            <section id="status-section" class="card hidden">
                <h3>处理进度</h3>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <p class="progress-text" id="progress-text">准备中...</p>
                <div class="steps" id="steps">
                    <div class="step" data-step="extracting">
                        <span class="step-icon">&#8987;</span>
                        <span>提取音频</span>
                    </div>
                    <div class="step" data-step="transcribing">
                        <span class="step-icon">&#9997;</span>
                        <span>语音识别</span>
                    </div>
                    <div class="step" data-step="translating">
                        <span class="step-icon">&#128220;</span>
                        <span>中文翻译</span>
                    </div>
                    <div class="step" data-step="generating">
                        <span class="step-icon">&#128196;</span>
                        <span>生成字幕</span>
                    </div>
                </div>
            </section>

            <!-- 结果区域 -->
            <section id="result-section" class="card hidden">
                <div class="result-success">
                    <span class="check-icon">&#10003;</span>
                    <h3>处理完成！</h3>
                </div>
                <p id="result-filename"></p>
                <a class="btn btn-success btn-full" id="btn-download" href="#" download>
                    下载中文字幕 (.srt)
                </a>
                <button class="btn btn-outline btn-full" id="btn-restart" style="margin-top: 8px;">
                    处理另一个视频
                </button>
            </section>

            <!-- 错误区域 -->
            <section id="error-section" class="card hidden">
                <div class="error-msg">
                    <span class="error-icon">&#9888;</span>
                    <h3>处理失败</h3>
                </div>
                <p id="error-text"></p>
                <button class="btn btn-outline btn-full" id="btn-retry">
                    重试
                </button>
            </section>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
